<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSentience - Network Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .admin-header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
        }

        .admin-header .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
        }

        .admin-content {
            padding: 32px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.up {
            background: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .status-indicator.down {
            background: var(--danger-color);
            box-shadow: 0 0 8px var(--danger-color);
        }

        .status-indicator.unknown {
            background: #94a3b8;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .device-table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .device-table table {
            margin: 0;
        }

        .device-table thead {
            background: #f1f5f9;
        }

        .device-table th {
            padding: 16px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            border-bottom: 2px solid var(--border-color);
        }

        .device-table td {
            padding: 16px;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }

        .device-table tbody tr {
            transition: background 0.2s;
        }

        .device-table tbody tr:hover {
            background: #f8fafc;
        }

        .device-table tbody tr:last-child td {
            border-bottom: none;
        }

        .badge-type {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-router { background: #dbeafe; color: #1e40af; }
        .badge-server { background: #dcfce7; color: #166534; }
        .badge-switch { background: #fef3c7; color: #92400e; }
        .badge-pc { background: #e0e7ff; color: #3730a3; }
        .badge-iot { background: #fce7f3; color: #9f1239; }

        .btn-action {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            margin: 0 2px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action:hover {
            transform: translateY(-1px);
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-nat {
            background: #8b5cf6;
            color: white;
        }

        .btn-nat:hover {
            background: #7c3aed;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .uptime-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
        }

        .uptime-high {
            background: #d1fae5;
            color: #065f46;
        }

        .uptime-medium {
            background: #fef3c7;
            color: #92400e;
        }

        .uptime-low {
            background: #fee2e2;
            color: #991b1b;
        }

        .modal-content {
            border: none;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            border: none;
            padding: 20px 24px;
        }

        .modal-header .btn-close {
            filter: invert(1);
        }

        .form-label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .form-control, .form-select {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            transition: all 0.2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .refresh-info {
            color: #64748b;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #e2e8f0;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .nat-rule-row {
            transition: background 0.2s;
        }

        .nat-rule-row:hover {
            background: #f8fafc;
        }

        .protocol-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #e0e7ff;
            color: #3730a3;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>🌐 NetSentience</h1>
                <span class="badge">Network Management System</span>
            </div>
            <div class="refresh-info">
                <span class="spinner" id="refreshSpinner"></span>
                <span id="lastUpdate">Loading...</span>
            </div>
        </div>

        <div class="admin-content">
            <div class="toolbar">
                <h2 class="h5 mb-0" style="color: #1e293b;">Device Management</h2>
                <button class="btn btn-primary" onclick="openAddDeviceModal()">
                    ➕ Add Device
                </button>
            </div>

            <div class="device-table">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th style="width: 5%">ID</th>
                            <th style="width: 20%">Device Name</th>
                            <th style="width: 15%">IP Address</th>
                            <th style="width: 12%">Type</th>
                            <th style="width: 12%">Status</th>
                            <th style="width: 12%">Uptime (24h)</th>
                            <th style="width: 14%">Last Checked</th>
                            <th style="width: 10%" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="deviceTableBody">
                        <tr>
                            <td colspan="8" class="empty-state">
                                <div class="spinner" style="width: 24px; height: 24px; margin: 0 auto;"></div>
                                <div style="margin-top: 12px;">Loading devices...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Device Modal -->
    <div class="modal fade" id="deviceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deviceModalTitle">Add Device</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="deviceId">
                    <div class="mb-3">
                        <label class="form-label">Device Name</label>
                        <input type="text" class="form-control" id="deviceName" placeholder="e.g., Main Router">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">IP Address</label>
                        <input type="text" class="form-control" id="deviceIp" placeholder="e.g., 192.168.1.1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Device Type</label>
                        <select class="form-select" id="deviceType">
                            <option value="Router">Router</option>
                            <option value="Server">Server</option>
                            <option value="Switch">Switch</option>
                            <option value="PC">PC</option>
                            <option value="IoT">IoT Device</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveDevice()">Save Device</button>
                </div>
            </div>
        </div>
    </div>

    <!-- NAT Rules Modal -->
    <div class="modal fade" id="natModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">NAT Rules - <span id="natDeviceName" style="color: #fbbf24;"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="card mb-3" style="border: 1px solid var(--border-color);">
                        <div class="card-body">
                            <h6 class="card-title mb-3">Add New NAT Rule</h6>
                            <div class="row g-2">
                                <div class="col-md-2">
                                    <label class="form-label" style="font-size: 11px;">Protocol</label>
                                    <select class="form-select form-select-sm" id="natProtocol">
                                        <option value="TCP">TCP</option>
                                        <option value="UDP">UDP</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" style="font-size: 11px;">Public Port</label>
                                    <input type="number" class="form-control form-control-sm" id="natPublicPort" placeholder="80">
                                </div>
                                <div class="col-md-1 text-center" style="padding-top: 28px;">
                                    <strong>→</strong>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" style="font-size: 11px;">Private IP</label>
                                    <input type="text" class="form-control form-control-sm" id="natPrivateIp" placeholder="192.168.1.5">
                                </div>
                                <div class="col-md-1 text-center" style="padding-top: 28px;">
                                    <strong>:</strong>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label" style="font-size: 11px;">Private Port</label>
                                    <input type="number" class="form-control form-control-sm" id="natPrivatePort" placeholder="8080">
                                </div>
                            </div>
                            <button class="btn btn-primary btn-sm mt-3" onclick="addNatRule()">Add Rule</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Protocol</th>
                                    <th>Public Port</th>
                                    <th>Private IP</th>
                                    <th>Private Port</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="natTableBody">
                                <tr>
                                    <td colspan="5" class="text-center text-muted py-4">Loading rules...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let currentNatDeviceId = null;
        let refreshInterval = null;

        const deviceModal = new bootstrap.Modal(document.getElementById('deviceModal'));
        const natModal = new bootstrap.Modal(document.getElementById('natModal'));

        // Format date/time
        function formatDateTime(dateString) {
            if (!dateString) return 'Never';
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Get status class
        function getStatusClass(status) {
            if (status === 'UP') return 'up';
            if (status === 'DOWN') return 'down';
            return 'unknown';
        }

        // Get type badge class
        function getTypeBadgeClass(type) {
            const typeLower = (type || '').toLowerCase();
            if (typeLower.includes('router')) return 'badge-router';
            if (typeLower.includes('server')) return 'badge-server';
            if (typeLower.includes('switch')) return 'badge-switch';
            if (typeLower.includes('pc')) return 'badge-pc';
            if (typeLower.includes('iot')) return 'badge-iot';
            return 'badge-router';
        }

        // Get uptime badge class
        function getUptimeBadgeClass(uptime) {
            if (uptime >= 99) return 'uptime-high';
            if (uptime >= 95) return 'uptime-medium';
            return 'uptime-low';
        }

        // Load all devices
        async function loadDevices() {
            try {
                const response = await fetch(`${API_BASE}/devices`);
                if (!response.ok) throw new Error('Failed to fetch devices');
                
                const devices = await response.json();
                const tbody = document.getElementById('deviceTableBody');
                
                if (devices.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" class="empty-state">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <div>No devices found. Add your first device to get started!</div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = '';
                
                // Load uptime for each device
                const devicePromises = devices.map(async (device) => {
                    try {
                        const uptimeResponse = await fetch(`${API_BASE}/devices/${device.id}/uptime`);
                        const uptimeData = await uptimeResponse.json();
                        return { device, uptime: uptimeData.upTimePercentage || 0 };
                    } catch (e) {
                        return { device, uptime: 0 };
                    }
                });

                const devicesWithUptime = await Promise.all(devicePromises);

                devicesWithUptime.forEach(({ device, uptime }) => {
                    const statusClass = getStatusClass(device.status);
                    const typeBadgeClass = getTypeBadgeClass(device.type);
                    const uptimeBadgeClass = getUptimeBadgeClass(uptime);
                    const uptimeDisplay = uptime.toFixed(1) + '%';

                    const natButton = device.type === 'Router' 
                        ? `<button class="btn-action btn-nat" onclick="openNatModal(${device.id}, '${device.name.replace(/'/g, "\\'")}')">NAT</button>`
                        : '';

                    tbody.innerHTML += `
                        <tr>
                            <td class="text-muted">#${device.id}</td>
                            <td><strong>${device.name || 'Unnamed'}</strong></td>
                            <td><code style="background: #f1f5f9; padding: 4px 8px; border-radius: 4px;">${device.ipAddress || 'N/A'}</code></td>
                            <td><span class="badge-type ${typeBadgeClass}">${device.type || 'Unknown'}</span></td>
                            <td>
                                <span class="status-indicator ${statusClass}"></span>
                                <span>${device.status || 'UNKNOWN'}</span>
                            </td>
                            <td>
                                <span class="uptime-badge ${uptimeBadgeClass}">${uptimeDisplay}</span>
                            </td>
                            <td class="text-muted small">${formatDateTime(device.lastChecked)}</td>
                            <td class="text-end">
                                ${natButton}
                                <button class="btn-action btn-edit" onclick="openEditDeviceModal(${device.id}, '${(device.name || '').replace(/'/g, "\\'")}', '${(device.ipAddress || '').replace(/'/g, "\\'")}', '${(device.type || '').replace(/'/g, "\\'")}')">Edit</button>
                                <button class="btn-action btn-delete" onclick="deleteDevice(${device.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('Error loading devices:', error);
                document.getElementById('deviceTableBody').innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-danger py-4">
                            Error loading devices. Please refresh the page.
                        </td>
                    </tr>
                `;
            }
        }

        // Device Management
        function openAddDeviceModal() {
            document.getElementById('deviceModalTitle').textContent = 'Add New Device';
            document.getElementById('deviceId').value = '';
            document.getElementById('deviceName').value = '';
            document.getElementById('deviceIp').value = '';
            document.getElementById('deviceType').value = 'Router';
            deviceModal.show();
        }

        function openEditDeviceModal(id, name, ip, type) {
            document.getElementById('deviceModalTitle').textContent = 'Edit Device';
            document.getElementById('deviceId').value = id;
            document.getElementById('deviceName').value = name;
            document.getElementById('deviceIp').value = ip;
            document.getElementById('deviceType').value = type;
            deviceModal.show();
        }

        async function saveDevice() {
            const id = document.getElementById('deviceId').value;
            const name = document.getElementById('deviceName').value.trim();
            const ip = document.getElementById('deviceIp').value.trim();
            const type = document.getElementById('deviceType').value;

            if (!name || !ip) {
                alert('Please fill in all required fields.');
                return;
            }

            const payload = {
                name: name,
                ipAddress: ip,
                type: type
            };

            try {
                const url = id 
                    ? `${API_BASE}/devices/${id}`
                    : `${API_BASE}/devices`;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error || 'Failed to save device');
                }

                deviceModal.hide();
                await loadDevices();
            } catch (error) {
                alert('Error saving device: ' + error.message);
                console.error('Save error:', error);
            }
        }

        async function deleteDevice(id) {
            if (!confirm('Are you sure you want to delete this device? This will also delete all associated NAT rules and monitoring history.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/devices/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete device');
                }

                await loadDevices();
            } catch (error) {
                alert('Error deleting device: ' + error.message);
                console.error('Delete error:', error);
            }
        }

        // NAT Management
        async function openNatModal(deviceId, deviceName) {
            currentNatDeviceId = deviceId;
            document.getElementById('natDeviceName').textContent = deviceName;
            await loadNatRules(deviceId);
            natModal.show();
        }

        async function loadNatRules(deviceId) {
            const tbody = document.getElementById('natTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Loading rules...</td></tr>';

            try {
                const response = await fetch(`${API_BASE}/nat/deviceId/${deviceId}`);
                if (!response.ok) throw new Error('Failed to fetch NAT rules');

                const rules = await response.json();

                if (rules.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">
                                No NAT rules configured. Add one above to get started.
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = '';
                rules.forEach(rule => {
                    tbody.innerHTML += `
                        <tr class="nat-rule-row">
                            <td><span class="protocol-badge">${rule.protocol || 'TCP'}</span></td>
                            <td><strong>${rule.publicPort}</strong></td>
                            <td><code>${rule.privateIp}</code></td>
                            <td><strong>${rule.privatePort}</strong></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-danger" onclick="deleteNatRule(${rule.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error loading NAT rules:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-danger py-4">
                            Error loading NAT rules.
                        </td>
                    </tr>
                `;
            }
        }

        async function addNatRule() {
            const protocol = document.getElementById('natProtocol').value;
            const publicPort = parseInt(document.getElementById('natPublicPort').value);
            const privateIp = document.getElementById('natPrivateIp').value.trim();
            const privatePort = parseInt(document.getElementById('natPrivatePort').value);

            if (!publicPort || !privateIp || !privatePort) {
                alert('Please fill in all fields.');
                return;
            }

            if (publicPort < 1 || publicPort > 65535 || privatePort < 1 || privatePort > 65535) {
                alert('Port numbers must be between 1 and 65535.');
                return;
            }

            const payload = {
                protocol: protocol,
                publicPort: publicPort,
                privateIp: privateIp,
                privatePort: privatePort
            };

            try {
                const response = await fetch(`${API_BASE}/nat/device/${currentNatDeviceId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error || 'Failed to add NAT rule');
                }

                // Clear form
                document.getElementById('natPublicPort').value = '';
                document.getElementById('natPrivateIp').value = '';
                document.getElementById('natPrivatePort').value = '';

                await loadNatRules(currentNatDeviceId);
            } catch (error) {
                alert('Error adding NAT rule: ' + error.message);
                console.error('Add NAT rule error:', error);
            }
        }

        async function deleteNatRule(ruleId) {
            if (!confirm('Are you sure you want to delete this NAT rule?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/nat/${ruleId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('Failed to delete NAT rule');
                }

                await loadNatRules(currentNatDeviceId);
            } catch (error) {
                alert('Error deleting NAT rule: ' + error.message);
                console.error('Delete NAT rule error:', error);
            }
        }

        // Initialize
        loadDevices();
        refreshInterval = setInterval(loadDevices, 10000); // Refresh every 10 seconds

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
